<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E4F5F1">
<title>ESPID 2026 — Shift Health Congress Planner</title>
<style>
:root{
  --ink:#343741;          /* logo charcoal */
  --teal:#20AA97;         /* logo teal */
  --teal-text:#0E7C6C;    /* darkened teal, AA on white */
  --teal-tint:#E4F5F1;
  --muted:#5C5F69;
  --rule:#D9DBE0;
  --rule-soft:#ECEEF1;
  --paper:#FFFFFF;
  --wash:#F6F7F8;
  --warn:#9A4A0B;         /* concurrency only */
  --sponsor:#FFD84D;      /* industry sponsor tag */
  --warn-tint:#FCEDDF;
  --lane-h:30px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--paper);
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
}
a{color:var(--teal-text)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}

/* ---------- header ---------- */
header{background:var(--teal-tint);color:var(--ink);padding:14px 18px;border-bottom:1px solid var(--teal)}
.hwrap{display:flex;align-items:center;gap:16px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.logo{height:42px;width:auto;display:block;flex:0 0 auto}
.htext h1{font-size:18px;color:var(--ink)}
.htext p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* ---------- filters ---------- */
.filters{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:2px solid var(--teal);padding:10px 18px;
}
.frow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;max-width:1500px;margin:0 auto}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-size:11px;font-weight:700;color:var(--teal-text);text-transform:none;letter-spacing:0.02em}
button.pbtn,label.chk,select,input[type=search]{font:inherit;font-size:13px}
button.pbtn{
  padding:4px 11px;border:1px solid var(--rule);background:#fff;color:var(--ink);
  border-radius:3px;cursor:pointer;
}
button.pbtn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pbtn:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
select,input[type=search]{padding:4px 8px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
input[type=search]{min-width:210px}
label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.daylinks .daydead{font-size:13px;padding:4px 9px;border:1px dashed var(--rule);
  border-radius:3px;color:var(--muted);white-space:nowrap;display:inline-block;opacity:.65}
.daylinks a{
  font-size:13px;text-decoration:none;padding:4px 9px;border:1px solid var(--teal);
  border-radius:3px;color:var(--teal-text);white-space:nowrap;
}
.count{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.count b{color:var(--ink)}

/* ---------- layout ---------- */
main{max-width:1500px;margin:0 auto;padding:0 18px 60px}
.day{padding-top:26px}
.dayhead{
  display:flex;align-items:baseline;gap:12px;
  border-bottom:2px solid var(--teal);padding-bottom:5px;margin-bottom:14px;
}
.dayhead h2{font-size:20px;color:var(--teal-text)}
.dayhead span{font-size:13px;color:var(--muted)}

/* ---------- timeline ---------- */
.tlwrap{border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-bottom:18px}
.tlhead{display:flex;background:var(--wash);border-bottom:1px solid var(--rule)}
.tlaxis{position:relative;height:22px;flex:1 1 auto}
.tlaxis i{position:absolute;top:0;font-size:11px;color:var(--muted);font-style:normal;transform:translateX(-50%)}
.tlaxis i::after{content:"";position:absolute;left:50%;top:16px;width:1px;height:6px;background:var(--rule)}
.lanelabel{
  flex:0 0 148px;font-size:11.5px;font-weight:600;color:var(--teal-text);
  padding:0 8px;display:flex;align-items:center;border-right:1px solid var(--rule);
  background:var(--wash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lane{display:flex;border-top:1px solid var(--rule-soft)}
.lane:first-of-type{border-top:none}
.lanetrack{position:relative;flex:1 1 auto;height:var(--lane-h);background:
  repeating-linear-gradient(90deg,transparent 0,transparent 59px,var(--rule-soft) 59px,var(--rule-soft) 60px)}
.postergroup .lanelabel{background:var(--teal-tint);color:var(--teal-text)}
.blk{
  position:absolute;top:4px;height:calc(var(--lane-h) - 8px);border-radius:2px;
  font-size:10.5px;line-height:1;display:flex;align-items:center;padding:0 5px;
  overflow:hidden;white-space:nowrap;cursor:pointer;z-index:3;
}
.blk.high{background:var(--ink);color:#fff;border:1px solid var(--ink)}
.blk.medium{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.blk.low{background:#fff;color:var(--muted);border:1px solid #C7C9CE}
.blk .tick{position:absolute;top:0;bottom:0;width:1px;background:currentColor;opacity:.45}
.band{position:absolute;top:0;bottom:0;background:var(--warn-tint);border-left:1px solid var(--warn);
  border-right:1px solid var(--warn);z-index:1;pointer-events:none}
.bandlabel{
  position:absolute;top:0;height:16px;font-size:9.5px;color:var(--warn);background:var(--warn-tint);
  border:1px solid var(--warn);border-top:none;padding:0 4px;line-height:14px;z-index:5;
  white-space:nowrap;border-radius:0 0 2px 2px;
}
.bandlayer{position:relative;height:18px;display:flex}
.bandlayer .lanelabel{background:#fff;border-right:1px solid var(--rule)}
.bandtrack{position:relative;flex:1 1 auto}

/* ---------- ribbon (mobile) ---------- */
.ribbon{display:none}
.rbtrack{position:relative;height:74px;border:1px solid var(--rule);border-radius:4px;background:#fff;overflow:hidden}
.rbaxis{position:relative;height:18px;margin-top:2px}
.rbaxis i{position:absolute;font-size:10px;color:var(--muted);font-style:normal;transform:translateX(-50%)}
.rbbar{position:absolute;border-radius:2px;cursor:pointer;z-index:3}
.rbbar.high{background:var(--ink)}
.rbbar.medium{background:#fff;border:1.5px solid var(--ink)}
.rbbar.low{background:#fff;border:1px solid #C7C9CE}
.rbbar.poster.high{background:repeating-linear-gradient(45deg,var(--ink) 0 3px,#5b5e68 3px 6px)}
.rbbar.poster.medium,.rbbar.poster.low{
  background:repeating-linear-gradient(45deg,#fff 0 3px,var(--rule) 3px 6px)}
.rbcap{font-size:12px;color:var(--ink);background:var(--wash);border-left:3px solid var(--teal);
  padding:7px 9px;margin-top:6px;border-radius:0 3px 3px 0;display:none}
.rbcap.on{display:block}

/* ---------- computed notes ---------- */
details.notes{border:1px solid var(--rule);border-left:4px solid var(--warn);border-radius:0 4px 4px 0;
  padding:8px 13px;margin-bottom:18px;background:#fff}
details.notes>summary{font-size:13.5px;color:var(--warn);font-weight:600;cursor:pointer;
  list-style:none;display:flex;align-items:baseline;gap:7px}
details.notes>summary::-webkit-details-marker{display:none}
details.notes>summary::before{content:"\25B8";display:inline-block;transition:transform .12s}
details.notes[open]>summary::before{transform:rotate(90deg)}
details.notes>summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
details.notes>summary span{font-weight:400;color:var(--muted)}
details.notes>summary .scope{font-size:10.5px;font-weight:600;color:var(--ink);
  background:var(--wash);border:1px solid var(--rule);border-radius:2px;padding:0 5px}
.notes ul{margin:8px 0 0;padding-left:17px}
.notes li{font-size:13px;margin-bottom:4px}
.notes .cost{color:var(--warn);font-weight:600}
.notes .none{font-size:13px;color:var(--muted);margin:8px 0 0}

/* ---------- slots & sessions ---------- */
.slot{margin-bottom:16px}
.slothead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:9px}
.slothead h3{font-size:15px;color:var(--ink)}
.slotnote{font-size:11.5px;color:var(--warn);background:var(--warn-tint);
  border:1px solid var(--warn);border-radius:2px;padding:1px 6px}
.sess{margin:0 0 12px;border-left:3px solid var(--teal);padding-left:11px}
.sesshead{margin-bottom:6px}
.sesstitle{font-size:14px;font-weight:600}
.sessmeta{font-size:12px;color:var(--muted);margin-top:2px}
.sessmeta em{font-style:normal;color:var(--teal-text);font-weight:600}

.item{border:1px solid var(--rule);border-radius:3px;padding:8px 10px;margin-bottom:6px;background:#fff}
.item.high{background:var(--ink);border-color:var(--ink);color:#fff}
.item.high .imeta{color:#DDDEE2}
.item.medium{border:2px solid var(--ink)}
.item.low{border:1px solid #DCDEE2;color:var(--muted)}
.item.low .ititle{color:var(--muted)}
.ititle{font-size:13.5px;font-weight:600;margin-bottom:3px}
.imeta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:2px;vertical-align:1px;
  margin-left:4px;white-space:nowrap}
.tag.ind{background:var(--sponsor);color:var(--ink);border:1px solid #E0B92E}
.tag.acad{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.item.high .tag.acad{color:#fff;border-color:rgba(255,255,255,.6)}
.tag.ta{color:#fff;border:1px solid transparent}
.item.high .tag.ta{box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.tag.conc{background:var(--warn-tint);color:var(--warn);border:1px solid var(--warn)}
.tag.tight{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.item.high .tag.conc{background:var(--warn-tint)}
.empty{color:var(--muted);font-size:13.5px;padding:26px 0}

/* ---------- responsive ---------- */
@media (max-width:760px){
  body{font-size:15px}
  main{padding:0 12px 44px}
  header{padding:12px}
  .logo{height:34px}
  .filters{padding:9px 12px}
  input[type=search]{min-width:0;flex:1 1 100%}
  .count{margin-left:0;width:100%}
  .tlwrap{display:none}
  .ribbon{display:block;margin-bottom:16px}
  .item{padding:9px}
  .sess{padding-left:9px}
}

/* ---------- print ---------- */
@media print{
  :root{--lane-h:26px}
  html,body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .filters{display:none}
  header{padding:8px 0}
  .ribbon{display:none}
  .tlwrap{display:block;page-break-inside:avoid}
  main{max-width:none;padding:0}
  .day{page-break-before:always;padding-top:8px}
  .day:first-of-type{page-break-before:auto}
  .sess,.item,.notes{page-break-inside:avoid}
  a{text-decoration:none}
}
</style>
</head>

/* ---------- helpers ---------- */
const hm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SESS = Object.fromEntries(DATA.sessions.map(s=>[s.key,s]));
const PRANK = {High:3,Medium:2,Low:1};
const isSponsored = s => s.type === 'Sponsored Symposium';

   every value carries white text at 5.1:1 or better, and none sits in
   the amber hue band reserved for concurrency. */
const TA_PALETTE = ['#1F5FA8','#7A2E8E','#0E7C6C','#A8332A','#2F6B2A','#1F6E8C',
                    '#8A2D5E','#4A4FA0','#5C3B8C','#2B4C7E','#3F6B00','#7A3B6B'];
const TA_COLOUR = {};
[...new Set(DATA.items.flatMap(i=>i.cats))].sort()
  .forEach((c,n)=>{TA_COLOUR[c]=TA_PALETTE[n%TA_PALETTE.length];});

/* ---------- filtering ---------- */
function baseFilter(){
  return DATA.items.filter(i=>{
    if(state.prio!=='All' && i.p!==state.prio) return false;
    if(state.cat && !i.cats.includes(state.cat)) return false;
    if(state.ind && !i.ind) return false;
    if(state.q){
      const hay=(i.title+' '+i.who+' '+i.abs+' '+SESS[i.sk].title+' '+i.aff+' '+i.spon).toLowerCase();
      if(!hay.includes(state.q)) return false;
    }
    return true;
  });
}

/* commitment window per session, per the time rules */
function commitments(items){
  const by={};
  items.forEach(i=>{(by[i.sk]=by[i.sk]||[]).push(i);});
  return Object.entries(by).map(([k,its])=>{
    const s=SESS[k];
    const cs = isSponsored(s) ? s.ws : Math.min(...its.map(x=>x.s));
    const ce = isSponsored(s) ? s.we : Math.max(...its.map(x=>x.e));
    const top = its.reduce((a,b)=>Math.max(a,PRANK[b.p]||0),0);
    return {key:k, sess:s, items:its.sort((a,b)=>a.s-b.s||a.room.localeCompare(b.room)),
            cs, ce, hi:its.filter(x=>x.p==='High').length, md:its.filter(x=>x.p==='Medium').length,
            lo:its.filter(x=>x.p==='Low').length,
            top: top===3?'high':top===2?'medium':'low'};
  }).sort((a,b)=>a.cs-b.cs||a.sess.room.localeCompare(b.sess.room));
}

/* ---------- computed notes ---------- */
function computeDay(coms){
  // concurrency: pairs of sessions in different rooms whose commitments overlap
  const conc=[], concKeys=new Set();
  for(let a=0;a<coms.length;a++) for(let b=a+1;b<coms.length;b++){
    const A=coms[a],B=coms[b];
    if(A.sess.room===B.sess.room) continue;
    const ov=Math.min(A.ce,B.ce)-Math.max(A.cs,B.cs);
    if(ov>0){conc.push({a:A,b:B,ov,from:Math.max(A.cs,B.cs),to:Math.min(A.ce,B.ce)});
             concKeys.add(A.key);concKeys.add(B.key);}
  }
  // merge overlap intervals into bands
  const iv=conc.map(c=>[c.from,c.to]).sort((x,y)=>x[0]-y[0]);
  const bands=[];
  iv.forEach(([s,e])=>{
    const last=bands[bands.length-1];
    if(last && s<=last[1]) last[1]=Math.max(last[1],e); else bands.push([s,e]);
  });
  // clusters: for each band, which rooms are live
  const clusters=bands.map(([s,e])=>{
    const rooms=coms.filter(c=>c.cs<e && c.ce>s)
      .map(c=>({room:c.sess.room,hi:c.hi,md:c.md,n:c.items.length,title:c.sess.title}))
      .sort((x,y)=>y.hi-x.hi||y.n-x.n);
    return {s,e,rooms};
  }).filter(c=>c.rooms.length>1);

  // tight transitions: non-overlapping sessions in different rooms, gap < 10 min
  const tight=[];
  for(let a=0;a<coms.length;a++) for(let b=0;b<coms.length;b++){
    if(a===b) continue;
    const A=coms[a],B=coms[b];
    if(A.sess.room===B.sess.room) continue;
    const gap=B.cs-A.ce;
    if(gap>=0 && gap<10) tight.push({from:A,to:B,gap});
  }
  const tightKeys=new Set(); tight.forEach(t=>{tightKeys.add(t.from.key);tightKeys.add(t.to.key);});

  // squeezed poster window: a timed session running inside the poster-hall window
  const posters=coms.filter(c=>c.sess.poster);
  const squeeze=[];
  if(posters.length){
    const ps=Math.min(...posters.map(c=>c.cs)), pe=Math.max(...posters.map(c=>c.ce));
    const boards=new Set(posters.map(c=>c.sess.room)).size;
    coms.filter(c=>!c.sess.poster).forEach(c=>{
      const ov=Math.min(c.ce,pe)-Math.max(c.cs,ps);
      if(ov>0){
        const survive=(pe-ps)-ov;
        squeeze.push({sess:c, ps, pe, lost:ov, survive, boards, per:(survive/boards)});
      }
    });
  }
  return {clusters, tight, tightKeys, concKeys, squeeze};
}

/* ---------- rendering ---------- */
const notesOpen={};   // day id -> panel left open by the user
function render(){
  let items=baseFilter();
  let coms=commitments(items);
  const dayCalc={};
  DATA.days.forEach(d=>{dayCalc[d.id]=computeDay(coms.filter(c=>c.sess.day===d.id));});

  if(state.conc){
    const keep=new Set(); Object.values(dayCalc).forEach(c=>c.concKeys.forEach(k=>keep.add(k)));
    items=items.filter(i=>keep.has(i.sk));
    coms=commitments(items);
    DATA.days.forEach(d=>{dayCalc[d.id]=computeDay(coms.filter(c=>c.sess.day===d.id));});
  }

  document.getElementById('liveCount').innerHTML =
    `<b>${items.length}</b> of ${DATA.items.length} items &middot; <b>${coms.length}</b> sessions`;

  const main=document.getElementById('main');
  if(!items.length){main.innerHTML='<p class="empty">No items match these filters.</p>';return;}

  main.innerHTML = DATA.days.map(d=>{
    const dc=coms.filter(c=>c.sess.day===d.id);
    if(!dc.length) return '';
    const calc=dayCalc[d.id];
    return `<section class="day" id="d${d.id}">
      <div class="dayhead"><h2>${esc(d.label)}</h2>
        <span>${dc.length} sessions &middot; ${dc.reduce((n,c)=>n+c.items.length,0)} items &middot; ${dc.reduce((n,c)=>n+c.hi,0)} high priority</span></div>
      ${timeline(dc,calc)}
      ${ribbon(dc,calc,d.id)}
      ${notes(calc,d.id)}
      ${slots(dc,calc)}
    </section>`;
  }).join('');

  document.getElementById('dayLinks').innerHTML = DATA.days.map(d=>{
    const n=coms.filter(c=>c.sess.day===d.id).reduce((t,c)=>t+c.items.length,0);
    return n ? `<a href="#d${d.id}">${esc(d.label)}</a>`
             : `<span class="daydead">${esc(d.label)}</span>`;
  }).join(' ');

  document.querySelectorAll('details.notes').forEach(el=>{
    const k=el.dataset.day;
    if(notesOpen[k]) el.open=true;
    el.addEventListener('toggle',()=>{notesOpen[k]=el.open;});
  });

  document.querySelectorAll('[data-cap]').forEach(el=>{
    el.onclick=()=>{
      const box=document.getElementById(el.dataset.capTarget);
      box.textContent=el.dataset.cap; box.classList.add('on');
    };
  });
}

function bounds(coms){
  let s=Math.min(...coms.map(c=>c.cs)), e=Math.max(...coms.map(c=>c.ce));
  s=Math.floor(s/60)*60; e=Math.ceil(e/60)*60;
  return [s,e];
}

function timeline(coms,calc){
  const [S,E]=bounds(coms), span=E-S;
  const pct=(a,b)=>({l:((a-S)/span*100),w:((b-a)/span*100)});
  const rooms=[...new Set(coms.map(c=>c.sess.room))]
    .sort((a,b)=>{
      const pa=a.startsWith('Station'),pb=b.startsWith('Station');
      if(pa!==pb) return pa?1:-1; return a.localeCompare(b);
    });
  let axis='';
  for(let t=S;t<=E;t+=60){axis+=`<i style="left:${(t-S)/span*100}%">${hm(t)}</i>`;}

  let bandsHTML='', labelHTML='';
  calc.clusters.forEach(cl=>{
    const p=pct(cl.s,cl.e);
    bandsHTML+=`<div class="band" style="left:${p.l}%;width:${p.w}%"></div>`;
    labelHTML+=`<div class="bandlabel" style="left:${p.l}%">Concurrent · ${cl.rooms.length} rooms</div>`;
  });

  const lanes=rooms.map(r=>{
    const mine=coms.filter(c=>c.sess.room===r);
    const blocks=mine.map(c=>{
      const p=pct(c.cs,c.ce);
      const ticks=c.items.length>1 ? c.items.slice(1).map(it=>
        `<span class="tick" style="left:${((it.s-c.cs)/(c.ce-c.cs)*100)}%"></span>`).join('') : '';
      const lab=`${c.hi?c.hi+'H ':''}${c.md?c.md+'M ':''}${c.lo?c.lo+'L':''}`.trim();
      const cap=`${hm(c.cs)}–${hm(c.ce)} · ${c.sess.room} · ${c.sess.title} (${lab})`;
      return `<div class="blk ${c.top}" style="left:${p.l}%;width:${Math.max(p.w,0.6)}%"
        title="${esc(cap)}">${ticks}${esc(lab)}</div>`;
    }).join('');
    const isP=r.startsWith('Station');
    return `<div class="lane${isP?' postergroup':''}"><div class="lanelabel">${esc(r)}</div>
      <div class="lanetrack">${blocks}</div></div>`;
  }).join('');

  return `<div class="tlwrap">
    <div class="tlhead"><div class="lanelabel">Room</div><div class="tlaxis">${axis}</div></div>
    <div class="bandlayer"><div class="lanelabel"></div><div class="bandtrack">${labelHTML}</div></div>
    <div style="position:relative">
      <div style="position:absolute;left:148px;right:0;top:0;bottom:0;pointer-events:none;z-index:1">${bandsHTML}</div>
      ${lanes}
    </div>
  </div>`;
}

function ribbon(coms,calc,dayId){
  const [S,E]=bounds(coms), span=E-S;
  const rowsEnd=[];
  const bars=coms.map(c=>{
    let r=rowsEnd.findIndex(x=>x<=c.cs);
    if(r===-1){r=rowsEnd.length;rowsEnd.push(0);}
    rowsEnd[r]=c.ce;
    const l=(c.cs-S)/span*100, w=Math.max((c.ce-c.cs)/span*100,1.2);
    const lab=`${c.hi?c.hi+'H ':''}${c.md?c.md+'M ':''}${c.lo?c.lo+'L':''}`.trim();
    const cap=`${hm(c.cs)}–${hm(c.ce)} · ${c.sess.room} · ${c.sess.title} · ${lab}`;
    return {r,html:(h)=>`<div class="rbbar ${c.top}${c.sess.poster?' poster':''}"
      style="left:${l}%;width:${w}%;top:${2+c.__r*h}px;height:${h-2}px"
      data-cap="${esc(cap)}" data-cap-target="cap${dayId}"></div>`, c};
  });
  bars.forEach((b,i)=>{b.c.__r=b.r;});
  const rows=Math.max(rowsEnd.length,1), h=Math.floor(70/rows);
  const bandHTML=calc.clusters.map(cl=>
    `<div class="band" style="left:${(cl.s-S)/span*100}%;width:${(cl.e-cl.s)/span*100}%"></div>`).join('');
  let axis='';
  for(let t=S;t<=E;t+=120){axis+=`<i style="left:${(t-S)/span*100}%">${hm(t)}</i>`;}
  return `<div class="ribbon">
    <div class="rbtrack">${bandHTML}${bars.map(b=>b.html(h)).join('')}</div>
    <div class="rbaxis">${axis}</div>
    <div class="rbcap" id="cap${dayId}"></div>
  </div>`;
}

function notes(calc,dayId){
  const li=[];
  calc.clusters.forEach(cl=>{
    const rr=cl.rooms.map(r=>`${esc(r.room)} — ${r.hi} high of ${r.n}`).join('; ');
    li.push(`<li><b>${hm(cl.s)}–${hm(cl.e)}</b> — ${cl.rooms.length} rooms concurrent. ${rr}.
      <span class="cost">${cl.e-cl.s} min needing ${cl.rooms.length} people for full coverage</span></li>`);
  });
  calc.squeeze.forEach(s=>{
    li.push(`<li><b>Squeezed poster window</b> — ${esc(s.sess.sess.title)} (${esc(s.sess.sess.room)},
      ${hm(s.sess.cs)}–${hm(s.sess.ce)}) sits inside the ${hm(s.ps)}–${hm(s.pe)} poster window.
      <span class="cost">Leaves ${s.survive} of ${s.pe-s.ps} board minutes across ${s.boards} stations
      — ${s.per.toFixed(1)} min per station</span></li>`);
  });
  const seen=new Set();
  calc.tight.forEach(t=>{
    const k=t.from.key+'>'+t.to.key; if(seen.has(k))return; seen.add(k);
    li.push(`<li><b>Tight transition</b> — ${esc(t.from.sess.room)} ends ${hm(t.from.ce)},
      ${esc(t.to.sess.room)} starts ${hm(t.to.cs)}. <span class="cost">${t.gap} min</span></li>`);
  });
  const bits=[];
  if(calc.clusters.length) bits.push(calc.clusters.length+(calc.clusters.length===1?' concurrent window':' concurrent windows'));
  if(calc.squeeze.length) bits.push(calc.squeeze.length+(calc.squeeze.length===1?' squeezed poster window':' squeezed poster windows'));
  if(seen.size) bits.push(seen.size+(seen.size===1?' tight transition':' tight transitions'));
  const scope = state.prio==='All' ? 'All priorities' : state.prio+' only';
  const narrowed = state.cat||state.ind||state.conc||state.q ? ' + filters' : '';
  return `<details class="notes" data-day="${dayId}"><summary>Coverage notes
    <b class="scope">${scope}${narrowed}</b>
    <span>${bits.length?bits.join(' &middot; '):'nothing flagged'}</span></summary>${
    li.length?`<ul>${li.join('')}</ul>`:'<p class="none">No concurrency, squeezed poster windows or tight transitions in the current selection.</p>'
  }</details>`;
}

function slots(coms,calc){
  const by={};
  coms.forEach(c=>{(by[c.cs]=by[c.cs]||[]).push(c);});
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(t=>{
    const group=by[t];
    const rooms=[...new Set(group.map(c=>c.sess.room))];
    const cl=calc.clusters.find(c=>t<c.e && group.some(g=>g.ce>c.s));
    const note = rooms.length>1
      ? `<span class="slotnote">Concurrent · ${rooms.length} rooms · ${group.reduce((n,c)=>n+c.hi,0)} high-priority items</span>`
      : (cl ? `<span class="slotnote">Concurrent with another room</span>` : '');
    return `<div class="slot"><div class="slothead"><h3>${hm(t)}</h3>${note}</div>
      ${group.map(c=>session(c,calc)).join('')}</div>`;
  }).join('');
}

function session(c,calc){
  const s=c.sess;
  const tags=[];
  if(calc.concKeys.has(c.key)) tags.push('<span class="tag conc">Concurrent</span>');
  if(calc.tightKeys.has(c.key)) tags.push('<span class="tag tight">Tight transition</span>');
  const commit = isSponsored(s)
    ? `Commits full window ${hm(s.ws)}–${hm(s.we)}` : `${hm(c.cs)}–${hm(c.ce)}`;
  return `<div class="sess">
    <div class="sesshead">
      <div class="sesstitle">${esc(s.title)} ${tags.join(' ')}</div>
      <div class="sessmeta"><em>${esc(s.type)}</em> &middot; ${esc(s.room)} &middot; ${commit}${
        s.sponsor?`<span class="tag ind">${esc(s.sponsor)}</span>`:''}</div>
    </div>
    ${c.items.map(item).join('')}
  </div>`;
}

function item(i){
  const cls=i.p.toLowerCase();
  const meta=[hm(i.s)+'–'+hm(i.e), i.room];
  if(i.who) meta.push(esc(i.who)+(i.loc?' ('+esc(i.loc)+')':''));
  if(i.abs) meta.push('Abstract '+esc(i.abs));
  const org = i.ind
    ? `<span class="tag ind">${esc(i.spon||i.aff)}</span>`
    : `<span class="tag acad">${esc(i.aff||'Academic')}</span>`;
  const ta = i.cats.map(c=>
    `<span class="tag ta" style="background:${TA_COLOUR[c]||'#5C5F69'}">${esc(c)}</span>`).join('');
  return `<div class="item ${cls}">
    <div class="ititle">${esc(i.title)||'<span style="opacity:.7">Title to be confirmed</span>'}${org}${ta}</div>
    <div class="imeta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>
  </div>`;
}

render();

/* printing should show the notes even when collapsed on screen */
let reopened=[];
window.addEventListener('beforeprint',()=>{
  reopened=[...document.querySelectorAll('details.notes:not([open])')];
  reopened.forEach(d=>d.open=true);
});
window.addEventListener('afterprint',()=>{reopened.forEach(d=>d.open=false);reopened=[];});
</script>
</body>
</html>
